# Raven profile; values are pilot defaults, not site qualification.
schema = "raven.config/v1"
profile = "desktop"

[site]
kind = "desktop"
cluster_id = ""
policy_file = ""

[connection]
transport = "none"
host = ""
user = ""
credential_reference = ""
ssh_options = []

[execution]
startup = "light"
heavy_target = "local"
heavy_requires_allocation = false
desktop_execution = "explicit"
allow_login_heavy = false
on_allocation_end = "light"
worker_python = ""
capabilities = ["view", "scheduler-read", "scheduler-action", "local-files", "terminal", "heavy-analysis", "instrumentation"]

[allocation]
adapter = "desktop"
account = ""
partition = ""
qos = ""
nodes = 1
tasks = 1
cpus_per_task = 2
memory_mib = 4096
gpus = 0
walltime_seconds = 3600
pending_timeout_seconds = 1200
idle_release_seconds = 600
reuse = "explicit"
auto_request_on_light_start = false
auto_renew = false
disconnect_policy = "stop-owned-worker"

[collection]
owner = "user-host"
slurm_enabled = false
remote_connections = "explicit"
queue_seconds = 60
starts_seconds = 120
history_seconds = 300
inventory_seconds = 300
details_seconds = 60
live_statistics = "selected-on-demand"
live_seconds = 60
gpu = "existing-telemetry"
weather_probes = false
account_seconds = 900
log_follow_seconds = 5
research_seconds = 5
trace_seconds = 1
idle_after_seconds = 300
idle_interval_factor = 5
jitter_fraction = 0.2
max_inflight = 2
controller_requests_per_minute = 12
controller_burst = 2
accounting_requests_per_minute = 2
step_launches_per_minute = 6
step_launch_interval_seconds = 10
statistics_requests_per_minute = 4
action_validation_requests_per_minute = 6
max_response_bytes = 4194304
max_response_records = 10000
live_batch_jobs = 16
circuit_failures = 3
circuit_seconds = 120
filesystem_metadata_per_minute = 120
file_bytes_per_minute = 16777216
local_processes_per_minute = 60
service_failure = "cached-only"

[resources]

[resources.light]
log_window_bytes = 2097152
prepared_cache_bytes = 33554432
pending_result_bytes = 8388608
max_terminal_sessions = 2
terminal_scrollback_bytes = 2097152
memory_mib = 256
max_workers = 2
max_jobs = 10000
max_history_jobs = 10000
max_job_rows = 5000
max_history_rows = 5000
max_series_jobs = 128
series_bytes = 16777216
max_log_buffers = 4
persistence_queue_bytes = 8388608
storage_bytes = 268435456
storage_files = 512
max_worker_queue = 64
max_source_commands = 2

[resources.heavy]
max_workers = 2
memory_mib = 4096
scratch_mib = 8192
max_tasks = 2
enforcement = "best-available"
cpu_seconds = 3600
wall_seconds = 3600
input_bytes = 8388608
output_bytes = 8388608

[storage]
series_format = "jsonl"
state_dir = "~/.local/state/raven"
coordination_dir = "auto-host-local"
durable_results = "~/raven-results"

[ui]
theme = "terminal"
show_execution_target = true
show_observation_age = true
ascii = false
animations = true
density = "comfortable"
worker_mode = "multi"

[telemetry]
preset = "default"

[telemetry.custom]
queue_seconds = 5.0
starts_seconds = 15.0
history_seconds = 30.0
inventory_seconds = 60.0
details_seconds = 10.0
live_seconds = 2.0
account_seconds = 300.0
log_follow_seconds = 1.0
research_seconds = 1.0
trace_seconds = 1.0
controller_requests_per_minute = 180
controller_burst = 4
accounting_requests_per_minute = 12
statistics_requests_per_minute = 60
filesystem_metadata_per_minute = 240
file_bytes_per_minute = 16777216
local_processes_per_minute = 300
