[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "7.0.0"
description = "Raven: a terminal research workbench with governed collection and explicit compute ownership"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Raven contributors"}]
keywords = ["slurm", "hpc", "dashboard", "tui", "curses", "cluster", "jobs"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "jsonschema>=4.18,<5", "hypothesis>=6,<7", "pytest-xdist>=3,<4", "import-linter>=2,<3", "ruff>=0.14,<1", "mypy>=1.18,<2"]
terminal = ["pyte>=0.8.2,<0.9", "wcwidth>=0.2.13,<1"]
wasi = ["wasmtime==49.0.0"]
mcp = ["mcp>=2.3.0,<2.4"]

[project.urls]
Homepage = "https://github.com/rahel99x/Raven"
Documentation = "https://github.com/rahel99x/Raven/blob/main/docs/raven/README.md"
Repository = "https://github.com/rahel99x/Raven"
Issues = "https://github.com/rahel99x/Raven/issues"

[project.scripts]
raven = "raven.raven_launch:light_main"
ravenl = "raven.raven_launch:light_main"
ravenh = "raven.raven_launch:heavy_main"

[tool.setuptools.packages.find]
include = ["raven", "raven.*"]

[tool.setuptools.package-data]
"raven.transport" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
