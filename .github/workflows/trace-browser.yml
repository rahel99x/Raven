name: trace-browser

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: trace-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install -e '.[dev,terminal]'
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Require real Chromium interaction and retained-journal integration
        shell: bash
        run: |
          export NODE_PATH="$PWD/node_modules"
          export RAVEN_BROWSER_EXECUTABLE="$(node -p 'require("playwright").chromium.executablePath()')"
          export RAVEN_REQUIRE_BROWSER=1
          python scripts/qualify_trace_workspace.py --output /tmp/raven-trace-browser-software.json
          python -m pytest -q tests/test_trace_workspace_browser.py tests/test_trace_workspace_analysis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-browser-software-qualification
          path: /tmp/raven-trace-browser-software.json
