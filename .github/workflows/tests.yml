name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development and optional terminal dependencies
        run: python -m pip install -e '.[dev,terminal]'
      - name: Install optional MCP and WASI adapters for runtime qualification
        if: matrix.python == '3.12'
        run: python -m pip install -e '.[mcp,wasi]'
      - name: Run isolated regression suite with two workers
        run: python -m pytest -q -n 2
      - name: Verify login and timezone independence
        if: matrix.python == '3.12'
        run: env -u USER TZ=America/Los_Angeles python -m pytest -q -n 2 tests/test_review_environment.py tests/test_doctor.py tests/test_adversarial_ui_review.py tests/test_setup_profiles.py tests/test_raven_config.py tests/test_forecast_scenarios.py tests/test_slurm_simulator.py
      - name: Check core names, typed boundaries and dependency contracts
        run: python scripts/check_quality.py
      - name: Check generated operation reference
        run: python scripts/generate_operation_reference.py --check
      - name: Check generated capability reference
        run: python scripts/generate_capability_reference.py --check
      - name: Validate reporting schemas and published examples
        run: python scripts/validate_operation_schemas.py
      - name: Check instrumentation fidelity and record bounded benchmark samples
        if: matrix.python == '3.12'
        run: python scripts/benchmark_auto_instrumentation.py --cases calls,noop,metrics,metric-threads --repeats 1 --timeout 60 --output /tmp/raven-instrumentation-benchmark.json
      - name: Exercise offline setup
        run: python scripts/setup.py --mode demo --venv /tmp/raven-offline-venv --report /tmp/raven-demo.txt
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify recorded Slurm fixtures and runnable example from the source distribution
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tarfile
          import tempfile

          archive_path, = pathlib.Path("dist").glob("*.tar.gz")
          with tempfile.TemporaryDirectory(prefix="raven-sdist-") as directory:
              # This archive was built by the preceding step; data filtering
              # also rejects unsafe paths and link targets during extraction.
              with tarfile.open(archive_path) as archive:
                  archive.extractall(directory, filter="data")
              source, = pathlib.Path(directory).iterdir()
              assert not (source / "docs/implementation").exists(), "Historical raw evidence must not enter the source distribution"
              fixtures = source / "tests/fixtures/review-temporal-holdout"
              assert sorted(str(path.relative_to(fixtures)) for path in fixtures.rglob("*.json")) == ["forecast/model.json", "forecast/result.json", "queue/model.json", "queue/result.json"]
              subprocess.run([sys.executable, "-c",
                  "import pathlib,raven; assert pathlib.Path(raven.__file__).resolve().is_relative_to(pathlib.Path.cwd())"],
                  cwd=source, check=True)
              subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/test_slurm_json.py", "tests/test_slurm_qualification.py",
                  "tests/test_completed_series_identity.py", "tests/test_trace_lab_example.py",
                  "tests/test_trace_lab_accelerators.py", "tests/test_forecast_scenarios.py",
                  "tests/test_slurm_simulator.py", "tests/test_review_environment.py"], cwd=source, check=True)
          PY
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/raven-wheel-venv
          /tmp/raven-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/raven-wheel-venv/bin/raven --doctor --fake
          /tmp/raven-wheel-venv/bin/ravenl --site desktop doctor
          /tmp/raven-wheel-venv/bin/ravenh --site desktop --plan
          /tmp/raven-wheel-venv/bin/raven mcp --help
          /tmp/raven-wheel-venv/bin/ravenl mcp --help
          /tmp/raven-wheel-venv/bin/ravenh mcp --help
          /tmp/raven-wheel-venv/bin/raven update --help
          /tmp/raven-wheel-venv/bin/ravenl update --help
          /tmp/raven-wheel-venv/bin/ravenh update --help
          /tmp/raven-wheel-venv/bin/raven revert --help
          /tmp/raven-wheel-venv/bin/ravenh revert --help
          /tmp/raven-wheel-venv/bin/raven trust --help
          /tmp/raven-wheel-venv/bin/ravenl trust --help
          /tmp/raven-wheel-venv/bin/ravenh trust --help
          /tmp/raven-wheel-venv/bin/raven trace cleanup-runtime --help
          /tmp/raven-wheel-venv/bin/raven trace capabilities --json
          /tmp/raven-wheel-venv/bin/ravenl qualify --offline > /tmp/raven-offline-qualification.json
          /tmp/raven-wheel-venv/bin/raven --fake --no-state --no-plugins --report /tmp/raven-wheel.txt
      - name: Qualify local CLI, documentation and terminal boundaries
        shell: bash
        run: |
          wheel=(dist/*.whl)
          python scripts/qualify_flagship.py --wheel "${wheel[0]}" --output /tmp/raven-qualification.json
      - name: Verify the optional terminal engine from the installed wheel
        shell: bash
        run: |
          wheel=(dist/*.whl)
          /tmp/raven-wheel-venv/bin/python -m pip install "${wheel[0]}[terminal]"
          cd /tmp
          /tmp/raven-wheel-venv/bin/raven terminal selftest --json
      - name: Qualify experimental core and lab extraction
        if: matrix.python == '3.12'
        run: python scripts/distribution_prototype.py --output /tmp/raven-distribution-prototype
      - name: Qualify installed update and revert lifecycles
        if: matrix.python == '3.12'
        run: |
          python -m pip install 'pipx>=1.7,<2'
          python scripts/qualify_updates.py --pipx --output /tmp/raven-update-qualification
      - name: Record and verify release contents and checksums
        run: |
          python scripts/release_inventory.py create --output dist/release-inventory.json --spdx dist/raven.spdx.json --checksums dist/SHA256SUMS --source-commit "$GITHUB_SHA" dist/*.whl dist/*.tar.gz
          python scripts/release_inventory.py verify dist/release-inventory.json dist/*.whl dist/*.tar.gz
          python scripts/release_inventory.py policy dist/release-inventory.json --expected-version "$(python -c 'from importlib.metadata import version; print(version("raven"))')" --expected-source "$GITHUB_SHA" dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: distributions-and-demo
          path: |
            dist/*
            /tmp/raven-demo.txt
            /tmp/raven-qualification.json
            /tmp/raven-offline-qualification.json
            /tmp/raven-instrumentation-benchmark.json
            /tmp/raven-distribution-prototype/manifest.json
            /tmp/raven-update-qualification
  legacy-bash:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ['3.2', '4.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Build pinned GNU Bash and execute bootstrap tests
        run: python scripts/qualify_bash_compat.py --version '${{ matrix.bash }}' --output '/tmp/raven-bash-${{ matrix.bash }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-bash-${{ matrix.bash }}
          path: |
            /tmp/raven-bash-${{ matrix.bash }}/*.log
            /tmp/raven-bash-${{ matrix.bash }}/result.json
  private-group-umask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'pipx>=1.7,<2'
      - name: Qualify actual managed and pipx update/revert under umask 002
        shell: bash
        run: |
          umask 002
          python scripts/qualify_updates.py --pipx --pipx-backend pip --output /tmp/raven-umask002-updates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umask002-updates
          path: /tmp/raven-umask002-updates
