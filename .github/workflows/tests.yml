name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development and optional terminal dependencies
        run: python -m pip install -e '.[dev,terminal]'
      - name: Install optional MCP and WASI adapters for runtime qualification
        if: matrix.python == '3.12'
        run: python -m pip install -e '.[mcp,wasi]'
      - name: Run regression suite
        run: python -m pytest -q
      - name: Check incremental package and typing boundaries
        run: python scripts/check_quality.py
      - name: Check generated operation reference
        run: python scripts/generate_operation_reference.py --check
      - name: Check generated capability reference
        run: python scripts/generate_capability_reference.py --check
      - name: Validate reporting schemas and published examples
        run: python scripts/validate_operation_schemas.py
      - name: Exercise offline setup
        run: python scripts/setup.py --mode demo --venv /tmp/raven-offline-venv --report /tmp/raven-demo.txt
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify recorded Slurm fixtures from the source distribution
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tarfile
          import tempfile

          archive_path, = pathlib.Path("dist").glob("*.tar.gz")
          with tempfile.TemporaryDirectory(prefix="raven-sdist-") as directory:
              # This archive was built by the preceding step; data filtering
              # also rejects unsafe paths and link targets during extraction.
              with tarfile.open(archive_path) as archive:
                  archive.extractall(directory, filter="data")
              source, = pathlib.Path(directory).iterdir()
              subprocess.run([sys.executable, "-c",
                  "import pathlib,raven; assert pathlib.Path(raven.__file__).resolve().is_relative_to(pathlib.Path.cwd())"],
                  cwd=source, check=True)
              subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/test_slurm_json.py", "tests/test_slurm_qualification.py",
                  "tests/test_completed_series_identity.py"], cwd=source, check=True)
          PY
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/raven-wheel-venv
          /tmp/raven-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/raven-wheel-venv/bin/raven --doctor --fake
          /tmp/raven-wheel-venv/bin/ravenl --site desktop doctor
          /tmp/raven-wheel-venv/bin/ravenh --site desktop --plan
          /tmp/raven-wheel-venv/bin/raven mcp --help
          /tmp/raven-wheel-venv/bin/ravenl mcp --help
          /tmp/raven-wheel-venv/bin/ravenh mcp --help
          /tmp/raven-wheel-venv/bin/ravenl qualify --offline > /tmp/raven-offline-qualification.json
          /tmp/raven-wheel-venv/bin/raven --fake --no-state --no-plugins --report /tmp/raven-wheel.txt
      - name: Qualify local CLI, documentation and terminal boundaries
        shell: bash
        run: |
          wheel=(dist/*.whl)
          python scripts/qualify_flagship.py --wheel "${wheel[0]}" --output /tmp/raven-qualification.json
      - name: Verify the optional terminal engine from the installed wheel
        shell: bash
        run: |
          wheel=(dist/*.whl)
          /tmp/raven-wheel-venv/bin/python -m pip install "${wheel[0]}[terminal]"
          cd /tmp
          /tmp/raven-wheel-venv/bin/raven terminal selftest --json
      - name: Qualify experimental core and lab extraction
        if: matrix.python == '3.12'
        run: python scripts/distribution_prototype.py --output /tmp/raven-distribution-prototype
      - name: Record and verify release contents and checksums
        run: |
          python scripts/release_inventory.py create --output dist/release-inventory.json --spdx dist/raven.spdx.json --checksums dist/SHA256SUMS --source-commit "$GITHUB_SHA" dist/*.whl dist/*.tar.gz
          python scripts/release_inventory.py verify dist/release-inventory.json dist/*.whl dist/*.tar.gz
          python scripts/release_inventory.py policy dist/release-inventory.json --expected-version "$(python -c 'from importlib.metadata import version; print(version("raven"))')" --expected-source "$GITHUB_SHA" dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: distributions-and-demo
          path: |
            dist/*
            /tmp/raven-demo.txt
            /tmp/raven-qualification.json
            /tmp/raven-offline-qualification.json
            /tmp/raven-distribution-prototype/manifest.json
